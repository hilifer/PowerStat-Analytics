# ============================================================
# PowerStat-Analytics 配置文件
# ============================================================

# --- 邮箱设置 ---
email:
  imap_server: "imap.qq.com"
  imap_port: 993
  use_ssl: true
  # 请在 .env 文件中设置以下敏感信息：
  #   EMAIL_ACCOUNT=your_email@qq.com
  #   EMAIL_AUTH_CODE=your_auth_code
  account: "${EMAIL_ACCOUNT}"
  auth_code: "${EMAIL_AUTH_CODE}"

  # 邮件过滤规则
  filter:
    # 发件人或主题须包含以下任一关键词
    subject_keywords: ["电费"]
    sender_keywords: ["电费"]
    # 收件人须包含
    recipient_keywords: ["曹先生"]
    # 拉取邮件的时间范围（可选，留空则拉取全部）
    since_date: null  # 格式: "2024-01-01"
    before_date: null

# --- 附件处理设置 ---
attachments:
  # 支持的附件类型
  supported_formats: [".xlsx", ".xls", ".pdf", ".png", ".jpg", ".jpeg", ".bmp", ".tiff"]
  # 临时下载目录
  temp_dir: "output/temp_attachments"
  # 最大附件大小 (MB)
  max_size_mb: 50

# --- OCR 设置 ---
ocr:
  # OCR 引擎: "tesseract" 或 "paddleocr"
  engine: "paddleocr"
  # Tesseract 语言包
  tesseract_lang: "chi_sim+eng"
  # OCR 置信度阈值 (0-1)
  confidence_threshold: 0.6

# --- 字段映射规则（人工可改） ---
field_mapping:
  # 电表号的可能表头名称
  meter_number:
    - "电表号"
    - "上网表号"
    - "发电表号"
    - "表号"
    - "电能表号"
    - "表计编号"

  # 资产编号
  asset_number:
    - "资产编号"
    - "资产号"
    - "设备编号"

  # 用户编号（核心关联键）
  user_id:
    - "用户编号"
    - "用户号"
    - "客户编号"
    - "户号"

  # 倍率
  multiplier:
    - "倍率"
    - "CT倍率"
    - "变比"
    - "互感器倍率"

  # 项目名称
  project_name:
    - "项目名称"
    - "项目"
    - "工程名称"
    - "电站名称"
    - "站点名称"

  # 表码数据 - 反向（上网表）
  reverse_readings:
    sharp_peak: ["反向尖峰", "反尖峰", "反向尖"]
    peak: ["反向峰", "反峰"]
    flat: ["反向平", "反平"]
    valley: ["反向谷", "反谷"]

  # 表码数据 - 正向（发电表）
  forward_readings:
    sharp: ["正向尖", "正尖"]
    peak: ["正向峰", "正峰"]
    flat: ["正向平", "正平"]
    valley: ["正向谷", "正谷"]

# --- 电表类型判定规则 ---
meter_type_rules:
  # 关键词匹配（文件名或表头中出现）
  grid_meter:  # 上网表
    keywords: ["上网", "上网表", "反向", "关口表"]
  generation_meter:  # 发电表
    keywords: ["发电", "发电表", "正向", "逆变"]

# --- 图片 OCR 关键字匹配规则 ---
ocr_extraction_rules:
  # 单价提取模式
  unit_price:
    patterns:
      - '(?:尖峰?|峰|平|谷)\s*[:：]?\s*(\d+\.?\d*)\s*(?:元|¥)'
      - '单价\s*[:：]?\s*(\d+\.?\d*)'
      - '(\d+\.\d{2,4})\s*元/[度kKwW]'
    # 尖峰平谷单价的具体匹配
    sharp_peak_price: ['尖峰?\s*[:：]?\s*(\d+\.\d+)']
    peak_price: ['(?<!尖)峰\s*[:：]?\s*(\d+\.\d+)']
    flat_price: ['平\s*[:：]?\s*(\d+\.\d+)']
    valley_price: ['谷\s*[:：]?\s*(\d+\.\d+)']
  # 用户编号提取模式（用于关联）
  user_id:
    patterns:
      - '(?:用户编号|用户号|户号|客户编号)\s*[:：]?\s*(\d{6,20})'
      - '(?:编号|No\.?)\s*[:：]?\s*(\d{8,20})'

# --- 数据存储设置 ---
storage:
  # SQLite 数据库路径
  database: "output/data/powerstat.db"
  # CSV 导出路径
  csv_export_dir: "output/data"
  # 归档根目录
  archive_root: "output/archive"

# --- 可视化设置 ---
visualization:
  # 图表输出目录
  output_dir: "output/charts"
  # 图表样式
  style: "seaborn-v0_8-whitegrid"
  # 中文字体（确保系统已安装）
  font_family: "SimHei"
  # 备用字体
  fallback_fonts: ["WenQuanYi Micro Hei", "Noto Sans CJK SC", "DejaVu Sans"]
  # DPI
  dpi: 150
  # 默认图表尺寸
  figure_size: [14, 8]

# --- 日志设置 ---
logging:
  level: "INFO"
  log_file: "logs/powerstat.log"
  max_size_mb: 10
  backup_count: 5
