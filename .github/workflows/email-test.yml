name: Email Fetch Pipeline

on:
  push:
    branches:
      - claude/electricity-bill-automation-AHVjJ

permissions:
  contents: write

jobs:
  email-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EMAIL_ACCOUNT: 2355279146@qq.com
      EMAIL_AUTH_CODE: mndmkfaqaeerdhjb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install IMAPClient openpyxl xlrd pdfplumber pandas PyYAML python-dotenv Flask click rich Pillow
          pip install rapidocr-onnxruntime || echo "rapidocr install failed, continuing"

      - name: Create .env
        run: |
          echo "EMAIL_ACCOUNT=$EMAIL_ACCOUNT" > .env
          echo "EMAIL_AUTH_CODE=$EMAIL_AUTH_CODE" >> .env

      - name: Quick IMAP connectivity test
        run: |
          python3 -c "
          import imaplib
          conn = imaplib.IMAP4_SSL('imap.qq.com', 993)
          conn.login('2355279146@qq.com', 'mndmkfaqaeerdhjb')
          conn.select('INBOX')
          st, msgs = conn.search(None, 'ALL')
          ids = msgs[0].split()
          print(f'IMAP OK - {len(ids)} emails in inbox')
          conn.logout()
          "

      - name: Run diagnose (with updated sender filter)
        continue-on-error: true
        run: python main.py diagnose 2>&1 | tee output/diagnose-result.txt

      - name: Run full email fetch pipeline
        continue-on-error: true
        run: python main.py fetch 2>&1 | tee output/fetch-result.txt

      - name: Show database info
        continue-on-error: true
        run: python main.py info 2>&1 | tee output/db-info.txt

      - name: List downloaded attachments
        continue-on-error: true
        run: |
          echo "=== Downloaded attachments ===" | tee output/attachments-list.txt
          find output/ -type f ! -name "*.txt" 2>/dev/null | head -50 | tee -a output/attachments-list.txt
          echo "" >> output/attachments-list.txt
          echo "=== Database file ===" >> output/attachments-list.txt
          ls -la output/data/ 2>/dev/null >> output/attachments-list.txt || echo "No data dir" >> output/attachments-list.txt

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f output/
          git commit -m "ci: email fetch pipeline results [skip ci]" || echo "No changes"
          git push
