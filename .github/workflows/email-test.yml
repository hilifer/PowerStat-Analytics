name: Email Fetch Pipeline

on:
  push:
    branches:
      - claude/electricity-bill-automation-AHVjJ

permissions:
  contents: write

jobs:
  email-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EMAIL_ACCOUNT: 2355279146@qq.com
      EMAIL_AUTH_CODE: mndmkfaqaeerdhjb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install IMAPClient openpyxl xlrd pdfplumber pandas PyYAML python-dotenv Flask click rich Pillow
          pip install rapidocr-onnxruntime || echo "rapidocr install failed, continuing"

      - name: Create .env
        run: |
          echo "EMAIL_ACCOUNT=$EMAIL_ACCOUNT" > .env
          echo "EMAIL_AUTH_CODE=$EMAIL_AUTH_CODE" >> .env

      - name: Clean old data (fresh run)
        run: |
          rm -rf output/data output/temp_attachments
          mkdir -p output/data

      - name: Run full email fetch pipeline
        continue-on-error: true
        run: python main.py fetch 2>&1 | tee output/fetch-result.txt

      - name: Show database info
        continue-on-error: true
        run: python main.py info 2>&1 | tee output/db-info.txt

      - name: Dump all data
        continue-on-error: true
        run: |
          python3 << 'SCRIPT' | tee output/data-dump.txt
          import sqlite3, os
          db_path = "output/data/powerstat.db"
          if not os.path.exists(db_path):
              print("DB not found"); exit()
          conn = sqlite3.connect(db_path)
          conn.row_factory = sqlite3.Row

          # 电表
          rows = conn.execute("SELECT * FROM meters ORDER BY meter_number").fetchall()
          print(f"=== 电表 ({len(rows)} 块) ===")
          for r in rows:
              print(f"  {r['meter_number']} | {r['meter_type']} | 用户={r['user_id']} | 倍率={r['multiplier']} | 项目={r['project_name']}")

          # 读数
          rows = conn.execute("""
              SELECT r.*, m.meter_number, m.meter_type, m.user_id
              FROM monthly_readings r JOIN meters m ON r.meter_id = m.id
              ORDER BY r.reading_month, m.meter_number
          """).fetchall()
          print(f"\n=== 抄表读数 ({len(rows)} 条) ===")
          for r in rows:
              print(f"  {r['reading_month']} | {r['meter_number']} ({r['meter_type']}) | "
                    f"尖={r['sharp_peak']} 峰={r['peak']} 平={r['flat']} 谷={r['valley']} "
                    f"总={r['total_kwh']} | 反向总={r['rev_total']}")

          # 单价
          rows = conn.execute("SELECT * FROM price_records ORDER BY reading_month").fetchall()
          print(f"\n=== 单价 ({len(rows)} 条) ===")
          for r in rows:
              print(f"  {r['reading_month']} | 用户={r['user_id']} | "
                    f"尖={r['sharp_peak_price']} 峰={r['peak_price']} 平={r['flat_price']} 谷={r['valley_price']}")

          # 已处理邮件
          rows = conn.execute("SELECT * FROM processed_emails ORDER BY processed_at").fetchall()
          print(f"\n=== 已处理邮件 ({len(rows)} 封) ===")
          for r in rows:
              print(f"  {r['subject']} | {r['email_date']} | {r['filename']}")

          # 可用月份
          months = conn.execute("SELECT DISTINCT reading_month FROM monthly_readings ORDER BY reading_month").fetchall()
          print(f"\n=== 可用月份 ===")
          for m in months:
              count = conn.execute("SELECT COUNT(*) FROM monthly_readings WHERE reading_month=?", (m[0],)).fetchone()[0]
              print(f"  {m[0]}: {count} 条读数")

          conn.close()
          SCRIPT

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f output/data/ output/*.txt
          git commit -m "ci: fresh pipeline results [skip ci]" || echo "No changes"
          git push
