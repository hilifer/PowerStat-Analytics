name: Email Fetch Pipeline

on:
  push:
    branches:
      - claude/electricity-bill-automation-AHVjJ

permissions:
  contents: write

jobs:
  email-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EMAIL_ACCOUNT: 2355279146@qq.com
      EMAIL_AUTH_CODE: mndmkfaqaeerdhjb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install IMAPClient openpyxl xlrd pdfplumber pandas PyYAML python-dotenv Flask click rich Pillow
          pip install rapidocr-onnxruntime || echo "rapidocr install failed, continuing"

      - name: Create .env
        run: |
          echo "EMAIL_ACCOUNT=$EMAIL_ACCOUNT" > .env
          echo "EMAIL_AUTH_CODE=$EMAIL_AUTH_CODE" >> .env

      - name: IMAP mailbox diagnostic
        continue-on-error: true
        run: |
          python3 << 'SCRIPT' | tee output/imap-diagnostic.txt
          import imaplib, email
          from email.header import decode_header

          def decode_hdr(val):
              if not val: return ""
              parts = decode_header(val)
              result = []
              for b, enc in parts:
                  if isinstance(b, bytes):
                      result.append(b.decode(enc or "utf-8", errors="replace"))
                  else:
                      result.append(b)
              return " ".join(result)

          conn = imaplib.IMAP4_SSL("imap.qq.com", 993)
          conn.login("2355279146@qq.com", "mndmkfaqaeerdhjb")

          # 列出所有文件夹
          status, folders = conn.list()
          print("=== IMAP 文件夹 ===")
          for f in folders:
              print(f"  {f.decode('utf-8', errors='replace')}")

          # 搜索 INBOX 中所有邮件
          conn.select("INBOX")
          status, all_ids = conn.search(None, "ALL")
          all_list = all_ids[0].split() if all_ids[0] else []
          print(f"\n=== INBOX 共 {len(all_list)} 封邮件 ===")

          # 列出所有邮件的发件人/收件人/主题/日期
          senders = ["2355279143", "2355279144", "2691510463"]
          print(f"\n=== 所有邮件列表（最近50封）===")
          for mid in all_list[-50:]:
              status, data = conn.fetch(mid, "(BODY[HEADER.FIELDS (FROM TO SUBJECT DATE)])")
              if status != "OK": continue
              hdr = email.message_from_bytes(data[0][1])
              frm = decode_hdr(hdr.get("From", ""))
              to = decode_hdr(hdr.get("To", ""))
              subj = decode_hdr(hdr.get("Subject", ""))
              dt = hdr.get("Date", "")
              match = "***" if any(s in f"{frm}{to}" for s in senders) else ""
              print(f"  {match} [{dt[:25]}] From={frm[:40]} To={to[:40]} Subject={subj[:50]}")

          # 按每个发件人分别搜索
          print(f"\n=== 按发件人搜索 ===")
          for addr in ["2355279143@qq.com", "2355279144@qq.com", "2691510463@qq.com"]:
              status, ids = conn.search(None, "OR", "FROM", addr, "TO", addr)
              count = len(ids[0].split()) if ids[0] else 0
              print(f"  {addr}: {count} 封")

          conn.logout()
          SCRIPT

      - name: Clean old data (fresh run)
        run: |
          rm -rf output/data output/temp_attachments
          mkdir -p output/data

      - name: Run full email fetch pipeline
        continue-on-error: true
        run: python main.py fetch 2>&1 | tee output/fetch-result.txt

      - name: Show database info
        continue-on-error: true
        run: python main.py info 2>&1 | tee output/db-info.txt

      - name: Dump all data
        continue-on-error: true
        run: |
          python3 << 'SCRIPT' | tee output/data-dump.txt
          import sqlite3, os
          db_path = "output/data/powerstat.db"
          if not os.path.exists(db_path):
              print("DB not found"); exit()
          conn = sqlite3.connect(db_path)
          conn.row_factory = sqlite3.Row

          # 电表
          rows = conn.execute("SELECT * FROM meters ORDER BY meter_number").fetchall()
          print(f"=== 电表 ({len(rows)} 块) ===")
          for r in rows:
              print(f"  {r['meter_number']} | {r['meter_type']} | 用户={r['user_id']} | 倍率={r['multiplier']} | 项目={r['project_name']}")

          # 读数
          rows = conn.execute("""
              SELECT r.*, m.meter_number, m.meter_type, m.user_id
              FROM monthly_readings r JOIN meters m ON r.meter_id = m.id
              ORDER BY r.reading_month, m.meter_number
          """).fetchall()
          print(f"\n=== 抄表读数 ({len(rows)} 条) ===")
          for r in rows:
              print(f"  {r['reading_month']} | {r['meter_number']} ({r['meter_type']}) | "
                    f"尖={r['sharp_peak']} 峰={r['peak']} 平={r['flat']} 谷={r['valley']} "
                    f"总={r['total_kwh']} | 反向总={r['rev_total']}")

          # 单价
          rows = conn.execute("SELECT * FROM price_records ORDER BY reading_month").fetchall()
          print(f"\n=== 单价 ({len(rows)} 条) ===")
          for r in rows:
              print(f"  {r['reading_month']} | 用户={r['user_id']} | "
                    f"尖={r['sharp_peak_price']} 峰={r['peak_price']} 平={r['flat_price']} 谷={r['valley_price']}")

          # 已处理邮件
          rows = conn.execute("SELECT * FROM processed_emails ORDER BY processed_at").fetchall()
          print(f"\n=== 已处理邮件 ({len(rows)} 封) ===")
          for r in rows:
              print(f"  {r['subject']} | {r['email_date']} | {r['filename']}")

          # 可用月份
          months = conn.execute("SELECT DISTINCT reading_month FROM monthly_readings ORDER BY reading_month").fetchall()
          print(f"\n=== 可用月份 ===")
          for m in months:
              count = conn.execute("SELECT COUNT(*) FROM monthly_readings WHERE reading_month=?", (m[0],)).fetchone()[0]
              print(f"  {m[0]}: {count} 条读数")

          conn.close()
          SCRIPT

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f output/*.txt output/imap-diagnostic.txt
          git commit -m "ci: fresh pipeline results [skip ci]" || echo "No changes"
          git push
