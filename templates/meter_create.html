{% extends "base.html" %}
{% block title %}新建电表 - PowerStat{% endblock %}

{% block content %}
<div class="breadcrumb">
    <a href="{{ url_for('index') }}">首页</a>
    <span class="sep">/</span>
    <a href="{{ url_for('meters_list') }}">电表管理</a>
    <span class="sep">/</span>
    <span>新建电表</span>
</div>

<h1 style="margin-bottom:1rem;">新建电表</h1>

<div class="card">
    <div class="card-header">
        <h2>填写电表信息</h2>
    </div>
    <form method="POST" action="{{ url_for('meter_create') }}">
        <div class="form-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; padding:1rem;">
            <div class="form-group">
                <label>电表号 <span style="color:red;">*</span></label>
                <input type="text" name="meter_number" required class="form-input" placeholder="请输入电表号">
            </div>
            <div class="form-group">
                <label>用户编号</label>
                <input type="text" name="user_id" class="form-input" placeholder="可选">
            </div>
            <div class="form-group">
                <label>电表类型</label>
                <select name="meter_type" class="form-input">
                    <option value="未知">未知</option>
                    <option value="上网表">上网表</option>
                    <option value="发电表">发电表</option>
                </select>
            </div>
            <div class="form-group">
                <label>资产编号</label>
                <input type="text" name="asset_number" class="form-input" placeholder="可选">
            </div>
            <div class="form-group">
                <label>倍率</label>
                <input type="number" step="0.01" name="multiplier" value="1.0" class="form-input">
            </div>
            <div class="form-group">
                <label>计价模式</label>
                <select name="pricing_mode" id="pricing-mode" class="form-input" onchange="togglePricingFields()">
                    <option value="discount">折扣</option>
                    <option value="fixed_discount">优惠固定价</option>
                    <option value="fixed_price">固定价</option>
                </select>
            </div>
            <div class="form-group" id="discount-field">
                <label>折扣系数</label>
                <input type="number" step="0.01" name="discount" value="1.0" class="form-input"
                       min="0" max="1" placeholder="如 0.98 = 9.8折">
                <small style="color:#666;">例: 9.8折 填 0.98，无折扣填 1.0</small>
            </div>
            <div class="form-group" id="pricing-param-field" style="display:none;">
                <label>计价参数</label>
                <input type="number" step="0.0001" name="pricing_param" class="form-input" placeholder="输入参数值">
                <small id="pricing-param-hint" style="color:#666;"></small>
            </div>
            <div class="form-group" style="grid-column: span 2;">
                <label>所属项目</label>
                <input type="text" name="project_name" class="form-input" list="project-list" placeholder="可选，可输入新项目名">
                <datalist id="project-list">
                    {% for p in projects %}
                    <option value="{{ p }}">
                    {% endfor %}
                </datalist>
            </div>
        </div>
        <div style="padding:0 1rem 1rem; display:flex; gap:0.5rem;">
            <button type="submit" class="btn btn-primary">创建电表</button>
            <a href="{{ url_for('meters_list') }}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>

<script>
function togglePricingFields() {
    var mode = document.getElementById('pricing-mode').value;
    var discountField = document.getElementById('discount-field');
    var paramField = document.getElementById('pricing-param-field');
    var paramHint = document.getElementById('pricing-param-hint');
    if (mode === 'discount') {
        discountField.style.display = '';
        paramField.style.display = 'none';
    } else if (mode === 'fixed_discount') {
        discountField.style.display = 'none';
        paramField.style.display = '';
        paramHint.textContent = '每 kWh 优惠的固定金额';
    } else if (mode === 'fixed_price') {
        discountField.style.display = 'none';
        paramField.style.display = '';
        paramHint.textContent = '固定电价（元/kWh）';
    }
}
document.addEventListener('DOMContentLoaded', togglePricingFields);
</script>

<style>
.form-group { display:flex; flex-direction:column; gap:0.3rem; }
.form-group label { font-weight:600; font-size:0.9rem; color:#333; }
.form-input { padding:0.5rem; border:1px solid #ddd; border-radius:4px; font-size:0.9rem; }
</style>
{% endblock %}
