# ============================================================
# PowerStat-Analytics 配置文件
# ============================================================

# --- 邮箱设置 ---
email:
  imap_server: "imap.qq.com"
  imap_port: 993
  use_ssl: true
  # 请在 .env 文件中设置以下敏感信息：
  #   EMAIL_ACCOUNT=your_email@qq.com
  #   EMAIL_AUTH_CODE=your_auth_code
  account: "${EMAIL_ACCOUNT}"
  auth_code: "${EMAIL_AUTH_CODE}"

  # 邮件过滤规则
  filter:
    # 发件人须包含以下任一（邮箱地址或名称）
    sender_keywords: ["2355279143@qq.com", "2355279143"]
    # 主题须包含以下任一关键词
    subject_keywords: ["电费", "电量", "抄表", "电表", "电力"]
    # 收件人过滤（留空不过滤）
    recipient_keywords: []
    # 拉取邮件的时间范围（可选，留空则拉取全部）
    since_date: null  # 格式: "2024-01-01"
    before_date: null

# --- 附件处理设置 ---
attachments:
  # 支持的附件类型
  supported_formats: [".xlsx", ".xls", ".pdf", ".png", ".jpg", ".jpeg", ".bmp", ".tiff", ".zip", ".rar", ".7z"]
  # 临时下载目录
  temp_dir: "output/temp_attachments"
  # 最大附件大小 (MB)
  max_size_mb: 50

# --- OCR 设置 ---
ocr:
  # OCR 引擎: "rapidocr"（推荐，ONNX 推理，模型随 pip 包分发）、"paddleocr" 或 "tesseract"
  engine: "rapidocr"
  # Tesseract 语言包
  tesseract_lang: "chi_sim+eng"
  # OCR 置信度阈值 (0-1)
  confidence_threshold: 0.6

# --- 字段映射规则（人工可改） ---
field_mapping:
  # 电表号的可能表头名称（各种叫法）
  meter_number:
    - "电表号"
    - "表号"
    - "电能表号"
    - "表计编号"
    - "电表编号"
    - "表计号"
    - "Meter No"

  # 资产编号
  asset_number:
    - "资产编号"
    - "资产号"
    - "设备编号"
    - "资产表"
    - "电表资产"
    - "电表资产号"
    - "核销资产号"
    - "发电表资产"
    - "上网表资产"
    - "资产产号"
    - "发电表资产编号"
    - "发电资产号"
    - "发电资产产号"
    - "上网表资产号"
    - "上网表资产产"
    - "上网电表资产表"
    - "上网电表资产"

  # 用户编号（核心关联键）
  user_id:
    - "用户编号"
    - "用户号"
    - "客户编号"
    - "户号"
    - "用电户号"
    - "用户"
    - "Account"
    - "用电户号"

  # 倍率
  multiplier:
    - "倍率"
    - "CT倍率"
    - "变比"
    - "互感器倍率"
    - "Billing Factor"

  # 项目名称
  project_name:
    - "项目名称"
    - "项目"
    - "工程名称"
    - "电站名称"
    - "站点名称"

  # 折扣（注意：不要用"折"或"优惠"，会误匹配"优惠后电价"等表头）
  discount:
    - "折扣"
    - "折后价"
    - "折后"

  # 电价（单价）
  unit_price:
    - "电价"
    - "单价"
    - "原电价"
    - "优惠后电价"
    - "Price"

  # 金额
  amount:
    - "金额"
    - "电费"
    - "费用"
    - "Amount"

  # 用电量
  usage:
    - "用电量"
    - "电表用量"
    - "实际用电数"
    - "总电量"

  # 统计日期 / 抄表日期
  reading_date:
    - "统计日期"
    - "抄表日期"
    - "抄表时间"
    - "数据日期"
    - "数据时间"
    - "计量日期"
    - "核算日期"

  # 用户名称
  user_name:
    - "用户名称"
    - "客户名称"
    - "用户姓名"
    - "客户姓名"

  # 用电地址
  address:
    - "用电地址"
    - "安装地址"
    - "地址"

  # 上网表号（配对关系）
  grid_meter_number:
    - "上网表号"
    - "上网电表号"
    - "上网表"
    - "并网表号"
    - "上网电表"
    - "上网表号"

  # 发电表号（配对关系）
  gen_meter_number:
    - "发电表号"
    - "发电电表号"
    - "发电表"
    - "逆变表号"
    - "发电表表号"

  # 正向有功总（用于定位正向读数区段）
  forward_total:
    - "正向有功总"
    - "正向总"
    - "正向有功"
    - "有功总"
    - "发电量"
    - "正向用电量"

  # 反向有功总（用于定位反向读数区段）
  reverse_total:
    - "反向有功总"
    - "反向总"
    - "反向有功"
    - "上网电量"
    - "上网用电量"
    - "反向用电量"

  # 表码数据 - 反向（上网表 / 反向表码 / 并网电量）
  reverse_readings:
    sharp_peak: ["反向尖峰", "反尖峰", "反向尖", "上网尖峰", "上网尖", "反_尖"]
    peak: ["反向峰", "反峰", "上网峰", "反_峰"]
    flat: ["反向平", "反平", "上网平", "反_平"]
    valley: ["反向谷", "反谷", "上网谷", "反_谷"]

  # 表码数据 - 正向（发电表 / 正向表码 / 发电量）
  # 注意：bare "尖/峰/平/谷" 放在正向中作为默认（单方向表格）
  forward_readings:
    sharp: ["正向尖", "正尖", "发电尖", "正_尖", "尖"]
    sharp_peak: ["正向尖峰", "正尖峰", "正_尖", "尖峰"]
    peak: ["正向峰", "正峰", "发电峰", "正_峰", "峰"]
    flat: ["正向平", "正平", "发电平", "正_平", "平"]
    valley: ["正向谷", "正谷", "发电谷", "正_谷", "谷"]

# --- 电表类型判定规则 ---
meter_type_rules:
  # 关键词匹配（文件名或表头中出现）
  grid_meter:  # 上网表
    keywords: ["上网", "上网表", "反向", "关口表", "并网", "反向表"]
  generation_meter:  # 发电表
    keywords: ["发电", "发电表", "正向", "逆变", "正向表", "光伏"]

# --- 图片 OCR 关键字匹配规则 ---
ocr_extraction_rules:
  # 单价提取模式
  unit_price:
    patterns:
      - '(?:尖峰?|峰|平|谷)\s*[:：]?\s*(\d+\.?\d*)\s*(?:元|¥)'
      - '单价\s*[:：]?\s*(\d+\.?\d*)'
      - '(\d+\.\d{2,8})\s*元/[度kKwWhH]'
      - '(?:电价|单价|价格)\s*[:：]?\s*(\d+\.\d{2,8})'
      - 'Price\s*[:：]?\s*(\d+\.\d{2,8})'
    # 尖峰平谷单价的具体匹配（多种格式容错）
    sharp_peak_price:
      - '尖峰?\s*[:：]?\s*(\d+\.\d+)'
      - '尖\s*峰?\s*(?:电价|单价|价格)?\s*[:：]?\s*(\d+\.\d+)'
    peak_price:
      - '(?<!尖)峰\s*[:：]?\s*(\d+\.\d+)'
      - '(?<!尖)\s*峰\s*(?:电价|单价|价格)?\s*[:：]?\s*(\d+\.\d+)'
    flat_price:
      - '平\s*[:：]?\s*(\d+\.\d+)'
      - '平\s*段?\s*(?:电价|单价|价格)?\s*[:：]?\s*(\d+\.\d+)'
    valley_price:
      - '谷\s*[:：]?\s*(\d+\.\d+)'
      - '谷\s*段?\s*(?:电价|单价|价格)?\s*[:：]?\s*(\d+\.\d+)'
  # 用户编号提取模式（用于关联）
  user_id:
    patterns:
      - '(?:用户编号|用户号|户号|客户编号|用户编码|客户号|用电户号)\s*[:：]?\s*(\d{6,20})'
      - '(?:编号|No\.?|NO\.?|Account\s*Numb)\s*[:：]?\s*(\d{8,20})'
      - '户\s*号\s*[:：]?\s*(\d{6,20})'
  # 电表号提取模式（从 OCR 图片中）
  meter_number:
    patterns:
      - '(?:电表编号|表计编号|Meter\s*No\.?)\s*[:：]?\s*(\d{6,20})'
      - '(?:表号)\s*[:：]?\s*(\d{6,20})'

# --- 数据智能关联规则 ---
reconciliation:
  # 从哪些单元格位置扫描关联信息（非表头行）
  scan_cells_for:
    - "用户号"
    - "用户编号"
    - "用电户号"
    - "户号"
    - "折"
    - "上网表"
    - "上网电表"
    - "发电表"
    - "发电电表"
    - "资产"
  # 折扣匹配模式
  discount_patterns:
    - '(\d+\.?\d*)\s*折'
    - '折扣\s*[:：]?\s*(\d+\.?\d*)'

# --- 数据存储设置 ---
storage:
  # SQLite 数据库路径
  database: "output/data/powerstat.db"
  # CSV 导出路径
  csv_export_dir: "output/data"
  # 归档根目录
  archive_root: "output/archive"

# --- 日志设置 ---
logging:
  level: "INFO"
  log_file: "logs/powerstat.log"
  max_size_mb: 10
  backup_count: 5
