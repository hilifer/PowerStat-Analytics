version: "3.8"

services:
  web:
    build: .
    container_name: powerstat-web
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./config:/app/config
      - ./output:/app/output
      - ./logs:/app/logs
    env_file:
      - .env
    command: ["python", "run_web.py", "--host", "0.0.0.0", "--port", "5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
