version: "3.8"

services:
  web:
    build: .
    container_name: powerstat-web
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    env_file:
      - .env
    entrypoint: ["python", "run_web.py", "--host", "0.0.0.0", "--port", "5000", "--debug"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
